# ═══════════════════════════════════════════════════════════════════════════════
# Kitty Built-in Quick Access Terminal (Quake Mode) Configuration
# ~/.config/kitty/quick-access-terminal.conf
# Toggled with Cmd+' via macOS System Settings > Keyboard > Keyboard Shortcuts >
# Services > General > "Quick access to kitty"; tuned to the old iTerm hotkey
# window. Changes here only apply after the quick access terminal is restarted.
# ═══════════════════════════════════════════════════════════════════════════════

# Full-width drop-down from the top edge, 40 rows like the iTerm hotkey profile
edge top
lines 40

# Hide when another app takes focus (iTerm's "auto-hide")
hide_on_focus_loss yes

# Same translucency as kitty.conf (the kitten defaults to 0.85)
background_opacity 0.76

# Everything else (colors, blur, font, pwsh shell) comes from kitty.conf
