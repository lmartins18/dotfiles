# ═══════════════════════════════════════════════════════════════════════════════
# Kitty Configuration — Migrated from Ghostty ("Horizon nvim" setup)
# ~/.config/kitty/kitty.conf
# ═══════════════════════════════════════════════════════════════════════════════

# ── Shell ─────────────────────────────────────────────────────────────────────
shell /opt/homebrew/bin/pwsh -NoLogo

# ── Font ──────────────────────────────────────────────────────────────────────
font_family      SF Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# ── Colors: Horizon (nvim) palette ───────────────────────────────────────────
background #1c1e26
foreground #d5d8da

cursor               #fab795
cursor_text_color    #1c1e26
cursor_shape         underline
cursor_blink_interval 0

selection_background #343647
selection_foreground #d5d8da

# ANSI Colors (0-7)
color0 #16161c
color1 #e95678
color2 #29d398
color3 #fab795
color4 #26bbd9
color5 #ee64ac
color6 #59e1e3
color7 #d5d8da

# ANSI Bright Colors (8-15)
color8  #6c6f93
color9  #ec6a88
color10 #3fdaa4
color11 #fbc3a7
color12 #3fc6de
color13 #f075b7
color14 #6be4e6
color15 #fadad1

# ── Window Styling & Blur (Ghostty Look & Feel) ───────────────────────────────
background_opacity         0.76
background_blur            20
window_padding_width       10 14
scrollback_lines           9001
hide_window_decorations    titlebar-only
macos_titlebar_color       background
macos_show_window_title_in none
macos_option_as_alt        both
confirm_os_window_close    0

# ── Window Borders & Panes ───────────────────────────────────────────────────
window_border_width        1pt
active_border_color        #fab795
inactive_border_color      #262833
bell_border_color          #e95678
draw_minimal_borders       yes

# ── Layouts ───────────────────────────────────────────────────────────────────
# "splits" allows flexible horizontal & vertical pane splitting like Ghostty/tmux
enabled_layouts            splits,stack,tall,fat,grid

# ── Tab Bar Styling ───────────────────────────────────────────────────────────
tab_bar_edge               top
tab_bar_style              powerline
tab_powerline_style        slanted
tab_bar_min_tabs           2
active_tab_foreground      #1c1e26
active_tab_background      #fab795
active_tab_font_style      bold
inactive_tab_foreground    #d5d8da
inactive_tab_background    #262833
inactive_tab_font_style    normal
tab_bar_background         #16161c

# ── Keybindings ───────────────────────────────────────────────────────────────

# Clipboard (Cmd+C / Cmd+V)
map super+c copy_to_clipboard
map super+v paste_from_clipboard

# Tabs
map super+shift+t  new_tab
map super+shift+w  close_window
map super+shift+n  new_os_window
map ctrl+tab       next_tab
map ctrl+shift+tab previous_tab

# Tab jump (Ctrl+Alt+1-9)
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9

# ── Panes / Splits (Ghostty Migration) ─────────────────────────────────────────
# Split right (vertical split)
map ctrl+shift+equal launch --location=vsplit --cwd=current
map ctrl+shift+plus  launch --location=vsplit --cwd=current

# Split down (horizontal split)
map ctrl+shift+minus launch --location=hsplit --cwd=current

# Auto split
map alt+shift+d      launch --location=split --cwd=current

# iTerm muscle memory: Cmd+D side by side, Cmd+Shift+D stacked
# (Cmd+Shift+D is kitty's default "close pane", so this also defuses that)
map super+d          launch --location=vsplit --cwd=current
map super+shift+d    launch --location=hsplit --cwd=current

# Pane navigation (Cmd+Option+Arrows — matching Ghostty & WezTerm)
map super+alt+left   neighboring_window left
map super+alt+right  neighboring_window right
map super+alt+up     neighboring_window up
map super+alt+down   neighboring_window down

# Pane resize (Cmd+Option+Shift+Arrows)
map super+alt+shift+left  resize_window narrower 3
map super+alt+shift+right resize_window wider 3
map super+alt+shift+up    resize_window shorter 3
map super+alt+shift+down  resize_window taller 3

# Zoom / fullscreen current pane (toggle stack)
map super+shift+z    toggle_layout stack

# Font size
map super+equal      change_font_size all +1.0
map super+plus       change_font_size all +1.0
map super+minus      change_font_size all -1.0
map super+0          change_font_size all 0

# Fullscreen (Cmd+Enter like iTerm — kitty's default opens a new pane)
map alt+enter        toggle_fullscreen
map super+enter      toggle_fullscreen

# PageUp/PageDown scroll the history at the shell like iTerm; full-screen apps
# (nvim, btop, less) still get the keys, kitty passes them through there
map page_up          scroll_page_up
map page_down        scroll_page_down

# Yazi in a new tab (Cmd+Shift+Y, same as WezTerm)
map super+shift+y    launch --type=tab --cwd=current /opt/homebrew/bin/yazi

# ── macOS Text Navigation ────────────────────────────────────────────────────
# Cmd+Backspace  -> kill line (Ctrl+U)
map super+backspace  send_text all \x15
# Option+Backspace -> backward kill word (ESC + DEL)
map alt+backspace    send_text all \x1b\x7f
# Option+Left/Right -> word jump (ESC+b / ESC+f)
map alt+left         send_text all \x1bb
map alt+right        send_text all \x1bf
# Cmd+Left/Right -> line start/end (Ctrl+A / Ctrl+E)
map super+left       send_text all \x01
map super+right      send_text all \x05
